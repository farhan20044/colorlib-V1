<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorlib-wizard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f8f9fa;
            color: #666;
        }
        
        .wizard-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            max-width: 900px;
            margin: 30px auto;
        }
        
        .wizard-steps {
            padding: 20px;
            background: #f8f9fa;
        }
        
        .step-list {
            display: flex;
            justify-content: space-between;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: space-between;
            position: relative;
        }
        
        .step-list:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #e9ecef;
            z-index: 1;
        }
        
        .step-item {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }
        
        .step-item:last-child {
            flex: 0;
        }
        
        .step-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #6c757d;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 5px;
            color: #6c757d;
        }
        
        .step-item.current .step-number {
            background: #6a11cb;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }
        
        .step-item.done .step-number {
            background: #28a745;
            color: white;
        }
        
        .step-icon {
            display: none;
        }
        
        .step-order {
            font-size: 12px;
            font-weight: 600;
        }
        
        .step-arrow {
            display: none;
        }
        
        .wizard-body {
            padding: 30px;
        }
        
        .step-content {
            display: none;
        }
        
        .step-content.active {
            display: block;
        }
        
        .step-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-holder {
            position: relative;
            margin-bottom: 20px;
        }
        
        .form-holder i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #6c757d;
        }
        
        .form-control {
            padding-left: 40px;
            height: 50px;
            border-radius: 4px;
        }
        
        .form-control:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 0.2rem rgba(106, 17, 203, 0.1);
        }
        
        .password i {
            cursor: pointer;
            right: 15px;
            left: auto;
        }
        
        .wizard-actions {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
        }
        
        .btn-nav {
            padding: 8px 25px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .btn-prev {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }
        
        .btn-next {
            background: #6a11cb;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
        }
        
        .btn-submit {
            background: #28a745;
            color: white;
            border: none;
            display: none;
        }
        
        .table-cart {
            width: 100%;
            margin-bottom: 20px;
        }
        
        .table-cart th {
            font-weight: 600;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #e9ecef;
        }
        
        .table-cart td {
            padding: 15px 10px;
            vertical-align: middle;
            border-bottom: 1px solid #e9ecef;
        }
        
        .product-thumb img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .product-detail a {
            font-weight: 600;
            color: #333;
            text-decoration: none;
        }
        
        .product-detail span {
            display: block;
            color: #6c757d;
            font-size: 14px;
        }
        
        .quantity {
            display: flex;
            align-items: center;
        }
        
        .quantity input {
            width: 50px;
            text-align: center;
            margin: 0 5px;
        }
        
        .plus, .minus {
            cursor: pointer;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .product-remove a {
            color: #dc3545;
            font-size: 18px;
        }
        
        .cart_totals {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 4px;
        }
        
        .cart_totals th {
            font-weight: 600;
            padding: 10px 0;
        }
        
        .cart_totals td {
            padding: 10px 0;
            text-align: right;
        }
        
        .checkbox {
            margin-bottom: 15px;
        }
        
        .checkbox label {
            display: block;
            position: relative;
            padding-left: 30px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        
        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: #f8f9fa;
            border-radius: 50%;
            border: 1px solid #dee2e6;
        }
        
        .checkbox input:checked ~ .checkmark {
            background-color: #6a11cb;
            border-color: #6a11cb;
        }
        
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        
        .checkbox input:checked ~ .checkmark:after {
            display: block;
        }
        
        .checkbox .checkmark:after {
            left: 7px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="wizard-container">
            <div class="wizard-steps">
                <ul class="step-list" role="tablist">
                    <li class="step-item first current" role="tab" aria-selected="true">
                        <a href="#" class="step-link" aria-controls="step-1">
                            <span class="step-number" style="display: none;">1</span>
                            <img src="../images/step-1-active.png" alt="">
                            <span class="step-order">Step 01</span>
                        </a>
                    </li>
                    <li class="step-item" role="tab" aria-selected="false">
                        <a href="#" class="step-link" aria-controls="step-2">
                            <span class="step-number" style="display: none;">2</span>
                            <img src="../images/step-2.png" alt="">
                        </a>
                    </li>
                    <li class="step-item" role="tab" aria-selected="false">
                        <a href="#" class="step-link" aria-controls="step-3">
                            <span class="step-number" style="display: none;">1</span>
                            <img src="../images/step-3.png" alt="">
                        </a>
                    </li>
                    <li class="step-item last" role="tab" aria-selected="false">
                        <a href="#" class="step-link" aria-controls="step-4">
                            <span class="step-number" style="display: none;">1</span>
                            <img src="../images/step-4.png" alt="">
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="wizard-body">
                <!-- SECTION 1 -->
                <div id="step-1" class="step-content active">
                    <h3 class="step-title">Basic details</h3>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-account"></i>
                                <input type="text" class="form-control" placeholder="First Name" id="fname">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-account"></i>
                                <input type="text" class="form-control" placeholder="Last Name" id="lname">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-email"></i>
                                <input type="text" class="form-control" placeholder="Email ID" id="email">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-account-box-o"></i>
                                <input type="text" class="form-control" placeholder="Your User ID" id="uid">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-map"></i>
                                <input type="text" class="form-control" placeholder="Country" id="country">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-holder">
                                <i class="zmdi zmdi-pin"></i>
                                <input type="text" class="form-control" placeholder="State" id="state">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-holder">
                                <i class="zmdi zmdi-pin-drop"></i>
                                <input type="text" class="form-control" placeholder="City" id="city">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-holder">
                                <i class="zmdi zmdi-smartphone-android"></i>
                                <input type="text" class="form-control" placeholder="Phone Number" id="phone">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-holder password">
                                <i class="zmdi zmdi-eye"></i>
                                <input type="password" class="form-control" placeholder="Reference Coder" id="refcode">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2 -->
                <div id="step-2" class="step-content">
                    <h3 class="step-title">Password change</h3>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-holder">
                                <i class="zmdi zmdi-lock-open"></i>
                                <input type="password" class="form-control" placeholder="Current Password">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-holder">
                                <i class="zmdi zmdi-lock-open"></i>
                                <input type="password" class="form-control" placeholder="Enter the Current Password">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-holder">
                                <i class="zmdi zmdi-lock-open"></i>
                                <input type="password" class="form-control" placeholder="New Password">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-holder">
                                <i class="zmdi zmdi-lock-open"></i>
                                <input type="password" class="form-control" placeholder="Confirm New Password">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3 -->
                <div id="step-3" class="step-content">
                    <h3 class="step-title">My Cart</h3>
                    <div class="table-responsive">
                        <table class="table-cart table">
                            <thead>
                                <tr>
                                    <th>&nbsp;</th>
                                    <th>Product Detail</th>
                                    <th>Quantity</th>
                                    <th>Total Price</th>
                                    <th>&nbsp;</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="product-thumb">
                                        <a href="#" class="item-thumb">
                                            <img src="images/item-1.jpg" alt="">
                                        </a>
                                    </td>
                                    <td class="product-detail">
                                        <div>
                                            <a href="#">Cherry</a>
                                            <span>$35</span>
                                        </div>
                                    </td>
                                    <td class="product-quantity">
                                        <div class="quantity">
                                            <span class="plus">+</span>
                                            <input type="number" class="form-control qty" value="1" min="0">
                                            <span class="minus">-</span>
                                        </div>
                                    </td>
                                    <td class="total-price">
                                        <span>$70</span>
                                    </td>
                                    <td class="product-remove">
                                        <a href="#">
                                            <i class="zmdi zmdi-close-circle-o"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="product-thumb">
                                        <a href="#" class="item-thumb">
                                            <img src="images/item-2.jpg" alt="">
                                        </a>
                                    </td>
                                    <td class="product-detail">
                                        <div>
                                            <a href="#">Mango</a>
                                            <span>$2035</span>
                                        </div>
                                    </td>
                                    <td class="product-quantity">
                                        <div class="quantity">
                                            <span class="plus">+</span>
                                            <input type="number" class="form-control qty" value="1" min="0">
                                            <span class="minus">-</span>
                                        </div>
                                    </td>
                                    <td class="total-price">
                                        <span>$20</span>
                                    </td>
                                    <td class="product-remove">
                                        <a href="#">
                                            <i class="zmdi zmdi-close-circle-o"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- SECTION 4 -->
                <div id="step-4" class="step-content">
                    <h3 class="step-title">Cart Totals</h3>
                    <div class="cart_totals">
                        <table class="table">
                            <tbody>
                                <tr class="cart-subtotal">
                                    <th>Subtotal</th>
                                    <td>$110.00</td>
                                </tr>
                                <tr class="cart-subtotal shipping">
                                    <th>Shipping:</th>
                                    <td>
                                        <div class="checkbox">
                                            <label>
                                                <input type="radio" name="shipping" checked> Free Shipping
                                                <span class="checkmark"></span>
                                            </label>
                                            <label>
                                                <input type="radio" name="shipping"> Local pickup: $0.00
                                                <span class="checkmark"></span>
                                            </label>
                                        </div>
                                        <span>Calculate shipping</span>
                                    </td>
                                </tr>
                                <tr class="cart-subtotal">
                                    <th>Service <span>(estimated for Vietnam)</span></th>
                                    <td>$5.60</td>
                                </tr>
                                <tr class="order-total">
                                    <th>Total</th>
                                    <td>$64.69</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="wizard-actions">
                <button class="btn btn-prev" disabled>
                    <i class="zmdi zmdi-arrow-left"></i> Back
                </button>
                <button class="btn btn-next">
                    Continue <i class="zmdi zmdi-arrow-right"></i>
                </button>
                <button class="btn btn-submit" style="display: none;">
                    Proceed to checkout <i class="zmdi zmdi-check"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const steps = document.querySelectorAll('.step-item');
            const stepContents = document.querySelectorAll('.step-content');
            const prevBtn = document.querySelector('.btn-prev');
            const nextBtn = document.querySelector('.btn-next');
            const submitBtn = document.querySelector('.btn-submit');
            
            let currentStep = 1;
            const totalSteps = steps.length;
            
            function updateWizard() {
                // Update steps
                steps.forEach((step, index) => {
                    step.classList.remove('current', 'done');
                    
                    if (index + 1 === currentStep) {
                        step.classList.add('current');
                    } else if (index + 1 < currentStep) {
                        step.classList.add('done');
                    }
                });
                
                // Update content
                stepContents.forEach((content, index) => {
                    content.classList.remove('active');
                    if (index + 1 === currentStep) {
                        content.classList.add('active');
                    }
                });
                
                // Update buttons
                prevBtn.disabled = currentStep === 1;
                
                if (currentStep === totalSteps) {
                    nextBtn.style.display = 'none';
                    submitBtn.style.display = 'inline-block';
                } else {
                    nextBtn.style.display = 'inline-block';
                    submitBtn.style.display = 'none';
                }
            }
            
            nextBtn.addEventListener('click', function() {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateWizard();
                }
            });
            
            prevBtn.addEventListener('click', function() {
                if (currentStep > 1) {
                    currentStep--;
                    updateWizard();
                }
            });
            
            submitBtn.addEventListener('click', function() {
                alert('Form submitted successfully!');
                // Form submission logic would go here
            });
            
            // Quantity controls
            document.querySelectorAll('.plus').forEach(plus => {
                plus.addEventListener('click', function() {
                    const input = this.nextElementSibling;
                    input.value = parseInt(input.value) + 1;
                    updatePrice(input);
                });
            });
            
            document.querySelectorAll('.minus').forEach(minus => {
                minus.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    if (parseInt(input.value) > 0) {
                        input.value = parseInt(input.value) - 1;
                        updatePrice(input);
                    }
                });
            });
            
            function updatePrice(input) {
                // This would update the price based on quantity
                // You would implement your actual price calculation logic here
                const row = input.closest('tr');
                const price = parseFloat(row.querySelector('.product-detail span').textContent.replace('$', ''));
                const total = price * parseInt(input.value);
                row.querySelector('.total-price span').textContent = '$' + total.toFixed(2);
            }
            
            // Password visibility toggle
            document.querySelectorAll('.password i').forEach(eye => {
                eye.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        this.classList.remove('zmdi-eye');
                        this.classList.add('zmdi-eye-off');
                    } else {
                        input.type = 'password';
                        this.classList.remove('zmdi-eye-off');
                        this.classList.add('zmdi-eye');
                    }
                });
            });
            
            // Initialize the wizard
            updateWizard();
        });
    </script>
</body>

</html>
